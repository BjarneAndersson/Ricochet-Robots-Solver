<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" style="paint-order: stroke;">
    <!-- Robot Body -->
    <circle cx="50" cy="62.5" r="35" stroke="black" stroke-width="2" fill="green"/>

    <!-- Robot Foot (behind the body) -->
    <polygon points="20,100 50,50 80,100" stroke="black" stroke-width="2" fill="green"/>

    <!-- Robot Head (on top of the body) -->
    <polygon points="23,40 50,0 77,40" stroke="black" stroke-width="2" fill="green"/>
</svg>
